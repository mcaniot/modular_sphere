name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual re-run from the Actions tab

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          sudo apt-get update && sudo apt-get install -y libosmesa6
          xvfb xauth libgl1 libegl1 libgl1-mesa-dri
      - run: uv sync --locked --extra dev
      # CPU-only PyTorch wheel for the MLP world model tests (the locked CUDA wheel is several GB).
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # Filament needs an X display: Mesa llvmpipe under Xvfb.
      - run: xvfb-run -a uv run pytest -rs --cov --cov-report=term --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python == '3.12'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
